name: Build Fabric Bridge

on:
  push:
    branches: [main, master]
    paths:
      - 'minecraft/fabric-bridge/**'
      - '.github/workflows/build-fabric.yml'
  pull_request:
    paths:
      - 'minecraft/fabric-bridge/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft/fabric-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.12 || true
          fi
          ./gradlew build --stacktrace --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicebridge-fabric
          path: minecraft/fabric-bridge/build/libs/*.jar
          if-no-files-found: warn
